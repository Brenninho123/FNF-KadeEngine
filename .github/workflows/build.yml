name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.7
  PROJECT_NAME: KadeEngine
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxe/lib
          key: haxelib-${{ inputs.os }}-${{ hashFiles('hmm.json') }}
          restore-keys: |
            haxelib-${{ inputs.os }}-

      - name: Update APT
        if: inputs.name == 'Linux'
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update --fix-missing

      - name: Install libVLC
        if: inputs.name == 'Linux'
        run: sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Setup XCode
        if: inputs.name == 'iOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Compile hxcpp build tools
        shell: bash
        run: |
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          cd -

      - name: Rebuild lime native tools
        shell: bash
        run: |
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild cpp

      - name: Verify lime.ndll was built
        shell: bash
        run: |
          echo "Searching for lime.ndll..."
          find .haxelib/lime/git/ndll -name "*.ndll" || true
          if ! find .haxelib/lime/git/ndll -name "*.ndll" | grep -q .; then
            echo "::error::lime.ndll was not produced by 'lime rebuild cpp'. Check the previous step's output for compile errors."
            exit 1
          fi

      - name: Setup lime
        shell: bash
        run: haxelib --always run lime setup

      - name: Configure Android
        if: inputs.name == 'Android x64' || inputs.name == 'Android x32'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Verify Android Signature
        if: inputs.name == 'Android x64' || inputs.name == 'Android x32'
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)
          APK_PATH=$(ls ${{ inputs.artifactPath }} | head -n 1)
          "${BUILD_TOOLS}apksigner" verify --verbose "$APK_PATH"
          "${BUILD_TOOLS}zipalign" -c -v 4 "$APK_PATH"

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
